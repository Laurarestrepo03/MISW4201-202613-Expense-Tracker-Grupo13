AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Expense Tracker Backend - Microservicios de Gastos e Ingresos

Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    MemorySize: 512
    Environment:
      Variables:
        ALLOWED_ORIGINS: "http://localhost:4200,http://54.209.54.122"


Resources:
  # ==================== DynamoDB Tables ====================
  
  ExpenseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'expense-table'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  IncomeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'income-table'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ==================== Lambda Functions ====================

  ExpenseServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'expense-service'
      CodeUri: expense-service/
      Handler: app.main.handler
      Description: Microservicio de gestión de gastos
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Environment:
        Variables:
          EXPENSE_TABLE: !Ref ExpenseTable
      Events:
        # Enruta /expenses y todos sus subpaths
        ExpenseRoot:
          Type: Api
          Properties:
            Path: /expenses
            Method: ANY
            RestApiId: !Ref ExpenseTrackerApi
        ExpenseProxy:
          Type: Api
          Properties:
            Path: /expenses/{proxy+}
            Method: ANY
            RestApiId: !Ref ExpenseTrackerApi
      Tags:
        Service: expense-service

  IncomeServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'income-service'
      CodeUri: income-service/
      Handler: app.main.handler
      Description: Microservicio de gestión de ingresos
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Environment:
        Variables:
          INCOME_TABLE: !Ref IncomeTable
      Events:
        # Enruta /incomes y todos sus subpaths 
        IncomeRoot:
          Type: Api
          Properties:
            Path: /incomes
            Method: ANY
            RestApiId: !Ref ExpenseTrackerApi
        IncomeProxy:
          Type: Api
          Properties:
            Path: /incomes/{proxy+}
            Method: ANY
            RestApiId: !Ref ExpenseTrackerApi
      Tags:
        Service: income-service

  # ==================== API Gateway ====================

  ExpenseTrackerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'expense-tracker-api'
      StageName: qa

# ==================== Outputs ====================

Outputs:
  ApiUrl:
    Description: URL del API Gateway
    Value: !Sub 'https://${ExpenseTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/qa/'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'
