server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos estáticos con hash: caché larga e inmutable
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routing de la SPA de Angular: cualquier ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché para servir siempre la última versión
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
